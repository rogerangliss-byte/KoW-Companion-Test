name: Build v4.6.0 Upgrade Targets once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v460-upgrade-targets-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add v4.6.0 Upgrade Targets and Recommendations
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>KoW Companion v4.5.0 TEST</title>','<title>KoW Companion v4.6.0 TEST</title>')
          s=s.replace('KoW Companion v4.5.0 TEST','KoW Companion v4.6.0 TEST')
          css='''\n/* v4.6.0 TEST — Upgrade Targets & Recommendations */\n.v460-target-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.v460-target-result{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.28)}.v460-target-result strong{color:var(--gold2)}@media(max-width:760px){.v460-target-grid{grid-template-columns:1fr}}\n'''
          s=s.replace('</style>',css+'</style>',1)
          card='''\n<div class="card wide" id="v460UpgradeTargetsCard">\n  <div class="eyebrow">v4.6.0 TEST</div>\n  <h2>🎯 Upgrade Targets & Recommendations</h2>\n  <p class="notice">Choose a target for the currently selected Officer. This first v4.6.0 test build compares the saved current position with your target and gives a clear next-step recommendation. It does not spend or alter Inventory.</p>\n  <div class="v460-target-grid">\n    <div><label>Target Level</label><input id="v460TargetLevel" type="number" min="1" max="70" value="70"></div>\n    <div><label>Target Stars</label><select id="v460TargetStars"><option value="1">1★</option><option value="2">2★</option><option value="3">3★</option><option value="4">4★</option><option value="5" selected>5★</option></select></div>\n    <div><label>Target Training</label><input id="v460TargetTraining" type="number" min="0" max="180" value="180"></div>\n    <div><label>Target</label><select id="v460TargetMode"><option value="custom">Custom target</option><option value="max" selected>MAX Officer</option></select></div>\n  </div>\n  <button class="primary app-action-primary" id="v460CalculateTarget" type="button">Calculate Target Recommendation</button>\n  <div class="v460-target-result" id="v460TargetResult"><strong>Ready:</strong> select an Officer and calculate a target.</div>\n</div>\n'''
          marker='<div id="officerView"'
          pos=s.find(marker)
          if pos<0:
              marker='<section id="officerView"'
              pos=s.find(marker)
          if pos>=0:
              end=s.find('>',pos)+1
              s=s[:end]+card+s[end:]
          else:
              # fallback: insert before closing app container area
              s=s.replace('</main>',card+'</main>',1) if '</main>' in s else s.replace('</body>',card+'</body>',1)
          js=r'''\n<script>\n// v4.6.0 TEST — Upgrade Targets & Recommendations (non-destructive milestone 1)\n(function(){\n function n(v,d){v=Number(v);return Number.isFinite(v)?v:d;}\n function selectedOfficerName(){\n   const candidates=['officerSelect','officer','officerName','selectedOfficer'];\n   for(const id of candidates){const e=document.getElementById(id);if(e&&e.value)return e.options&&e.selectedIndex>=0?e.options[e.selectedIndex].text:e.value;}\n   const h=document.querySelector('#officerView h2,#officerView h3');return h?h.textContent.trim():'Selected Officer';\n }\n function currentValue(ids,fallback){for(const id of ids){const e=document.getElementById(id);if(e&&e.value!==undefined&&e.value!=='')return n(e.value,fallback);}return fallback;}\n function calc(){\n   const mode=document.getElementById('v460TargetMode').value;\n   if(mode==='max'){document.getElementById('v460TargetLevel').value=70;document.getElementById('v460TargetStars').value=5;document.getElementById('v460TargetTraining').value=180;}\n   const tl=n(document.getElementById('v460TargetLevel').value,70), ts=n(document.getElementById('v460TargetStars').value,5), tt=n(document.getElementById('v460TargetTraining').value,180);\n   const cl=currentValue(['officerLevel','level','currentLevel'],0), cs=currentValue(['starLevel','stars','officerStars'],0), ct=currentValue(['training','trainingLevel','officerTraining'],0);\n   const dl=Math.max(0,tl-cl), ds=Math.max(0,ts-cs), dt=Math.max(0,tt-ct);\n   let rec=[]; if(dl)rec.push(dl+' Officer level'+(dl===1?'':'s')); if(ds)rec.push(ds+' Star level'+(ds===1?'':'s')); if(dt)rec.push(dt+' Training stage'+(dt===1?'':'s'));\n   const ready=!rec.length;\n   document.getElementById('v460TargetResult').innerHTML='<strong>'+selectedOfficerName()+'</strong><br>Current detected position: Level '+cl+' · '+cs+'★ · Training '+ct+'<br>Target: Level '+tl+' · '+ts+'★ · Training '+tt+'<br><strong>Recommendation:</strong> '+(ready?'Target already achieved.':'Develop '+rec.join(', ')+'. Inventory-aware resource recommendations will be added in the next v4.6.0 milestone.');\n }\n function init(){const b=document.getElementById('v460CalculateTarget');if(!b)return;b.addEventListener('click',calc);document.getElementById('v460TargetMode').addEventListener('change',function(){if(this.value==='max'){document.getElementById('v460TargetLevel').value=70;document.getElementById('v460TargetStars').value=5;document.getElementById('v460TargetTraining').value=180;}});}\n if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n})();\n</script>\n'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify v4.6.0 test identity and feature
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'KoW Companion v4.6.0 TEST' index.html
          grep -q 'v460UpgradeTargetsCard' index.html
          grep -q 'Calculate Target Recommendation' index.html
          grep -q 'v4.6.0 TEST — Upgrade Targets & Recommendations' index.html
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FireStorm Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/build-v460-upgrade-targets-once.yml
          git add index.html
          git commit -m 'KoW Companion v4.6.0 TEST: Upgrade Targets milestone 1'
          git pull --rebase origin main
          git push origin main
