name: v4.6.0 source correction once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v460-source-fix-once.yml'

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct v4.6.0 source and retire runtime rewrite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=re.sub(r'ENGLISH TEST\s*—\s*v4\.5\.0\s*—\s*NOT LIVE', 'ENGLISH TEST — v4.6.0 — NOT LIVE', s)
          s=s.replace('Officer Companion v4.5.0','Officer Companion v4.6.0')
          s=re.sub(r"const\s+APP_VERSION\s*=\s*['\"]4\.5\.0['\"]\s*;", "const APP_VERSION='4.6.0';", s)
          s=s.replace('Installed version: v4.5.0','Installed version: v4.6.0')
          s=s.replace('KoW Companion v4.5.0','KoW Companion v4.6.0')
          s=s.replace('Version header, Settings, About and Version Integrity all report <b>v4.5.0 TEST</b>.','Version header, Settings, About and Version Integrity all report <b>v4.6.0 TEST</b>.')
          s=s.replace('<title>KoW Companion v4.5.0 TEST</title>','<title>KoW Companion v4.6.0 TEST</title>')

          p.write_text(s,encoding='utf-8')

          sw=Path('service-worker.js')
          sw.write_text("""const CACHE='kow-english-test-v4.6.0-source-1';
self.addEventListener('install',event=>{self.skipWaiting();});
self.addEventListener('activate',event=>{
  event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));
});
self.addEventListener('fetch',event=>{
  if(event.request.method!=='GET')return;
  const req=event.request;
  event.respondWith(fetch(req,{cache:'no-store'}).then(response=>{
    const copy=response.clone();
    caches.open(CACHE).then(cache=>cache.put(req,copy));
    return response;
  }).catch(()=>caches.match(req).then(r=>r||caches.match('./index.html'))));
});
""",encoding='utf-8')

          wf=Path('.github/workflows/v460-source-fix-once.yml')
          if wf.exists(): wf.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js .github/workflows/v460-source-fix-once.yml
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'Correct v4.6.0 English Test source identity'
          git push
