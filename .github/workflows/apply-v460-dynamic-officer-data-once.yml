name: Apply v4.6.0 Dynamic Officer Data once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v460-dynamic-officer-data-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v4.6.0 English Test integration
        shell: python
        run: |
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('ENGLISH TEST — v4.5.0 — NOT LIVE','ENGLISH TEST — v4.6.0 — NOT LIVE')
          s=s.replace("const APP_VERSION='4.5.0';","const APP_VERSION='4.6.0';")

          marker='async function loadOfficers(){'
          if marker not in s:
              raise SystemExit('loadOfficers marker missing')

          if 'KOW_OFFICER_DATA_VERSION_URL' not in s:
              block=r'''
const KOW_OFFICER_DATA_VERSION_URL='https://raw.githubusercontent.com/rogerangliss-byte/KoW-Companion-Test/main/officer-data-version.json';
const KOW_OFFICER_DATA_URL='https://raw.githubusercontent.com/rogerangliss-byte/KoW-Companion-Test/main/officers.json';
window.KOW_OFFICER_DATA_STATUS={state:'not-checked',dataVersion:'bundled',publishedAt:null,officerCount:null,source:'Bundled fallback'};
async function fetchDynamicOfficerData(){
  let manifest=null;
  try{
    const vr=await fetch(KOW_OFFICER_DATA_VERSION_URL+'?t='+Date.now(),{cache:'no-store'});
    if(vr.ok)manifest=await vr.json();
  }catch(e){}
  const dataVersion=String(manifest?.dataVersion||Date.now());
  try{
    const response=await fetch(KOW_OFFICER_DATA_URL+'?v='+encodeURIComponent(dataVersion)+'&t='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('Officer data request failed');
    const data=await response.json();
    if(!Array.isArray(data)||!data.length)throw new Error('Officer data is empty');
    window.KOW_OFFICER_DATA_STATUS={state:'global',dataVersion,publishedAt:manifest?.publishedAt||null,officerCount:data.length,source:'Global Officer data — English Test'};
    return data;
  }catch(e){
    window.KOW_OFFICER_DATA_STATUS={state:'fallback',dataVersion:'bundled',publishedAt:null,officerCount:null,source:'Bundled/local fallback',error:String(e?.message||e)};
    return null;
  }
}
function renderOfficerDataStatus(){
  const box=document.getElementById('officerDataStatus');if(!box)return;
  const st=window.KOW_OFFICER_DATA_STATUS||{};
  const when=st.publishedAt?new Date(st.publishedAt).toLocaleString():'—';
  box.innerHTML=`<b>Officer data:</b> ${st.state==='global'?'✅ Global data loaded':'⚠️ Fallback data in use'}<br>`+
    `<b>Data version:</b> ${String(st.dataVersion||'—')}<br>`+
    `<b>Officers:</b> ${st.officerCount??'—'}<br>`+
    `<b>Published:</b> ${when}<br><span class="muted">${String(st.source||'')}</span>`;
}
'''
              s=s.replace(marker,block+'\n'+marker,1)

          old_fetch="const response=await fetch('./officers.json?v=435-live-comprehensive-docs',{cache:'no-store'});"
          if old_fetch in s:
              new_fetch="const dynamicData=await fetchDynamicOfficerData();\n   const response=dynamicData ? {ok:true,json:async()=>dynamicData} : await fetch('./officers.json?v=460-dynamic-fallback',{cache:'no-store'});"
              s=s.replace(old_fetch,new_fetch,1)
          elif 'const dynamicData=await fetchDynamicOfficerData();' not in s:
              raise SystemExit('Officer JSON fetch line not found')

          if 'id="officerDataStatus"' not in s:
              settings_marker='<h3>App Updates</h3>'
              if settings_marker not in s:
                  raise SystemExit('Settings App Updates marker missing')
              status_html='''<h3>Global Officer Data</h3>\n      <div id="officerDataStatus" class="notice">Checking global Officer data…</div>\n      <p class="notice">v4.6.0 TEST loads published Officer data independently of the main app build. New Officer releases can be published by updating <b>officers.json</b> and <b>officer-data-version.json</b> without changing calculation code.</p>\n      '''
              s=s.replace(settings_marker,status_html+settings_marker,1)

          if 'await loadOfficers();renderOfficerDataStatus();renderOfficerFilters();' not in s:
              if 'await loadOfficers();renderOfficerFilters();' not in s:
                  raise SystemExit('init loadOfficers call not found')
              s=s.replace('await loadOfficers();renderOfficerFilters();','await loadOfficers();renderOfficerDataStatus();renderOfficerFilters();',1)

          if "setTimeout(renderOfficerDataStatus,150)" not in s:
              hook="document.addEventListener('DOMContentLoaded',syncVersionUI);"
              if hook in s:
                  s=s.replace(hook,hook+"\ndocument.addEventListener('DOMContentLoaded',()=>setTimeout(renderOfficerDataStatus,150));",1)

          p.write_text(s,encoding='utf-8')

          sw=Path('service-worker.js')
          if sw.exists():
              t=sw.read_text(encoding='utf-8')
              t=t.replace("kow-english-test-v4.5.0-clean-live-baseline-1","kow-english-test-v4.6.0-test1")
              sw.write_text(t,encoding='utf-8')

      - name: Verify v4.6.0 integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const APP_VERSION='4.6.0';" index.html
          grep -q 'ENGLISH TEST — v4.6.0 — NOT LIVE' index.html
          grep -q 'KOW_OFFICER_DATA_VERSION_URL' index.html
          grep -q 'fetchDynamicOfficerData' index.html
          grep -q 'const dynamicData=await fetchDynamicOfficerData();' index.html
          grep -q 'id="officerDataStatus"' index.html
          grep -q 'kow-english-test-v4.6.0-test1' service-worker.js
          test -f officer-data-version.json
          test -f officers.json

      - name: Commit completed v4.6.0 Test build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FireStorm Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-v460-dynamic-officer-data-once.yml
          git add index.html service-worker.js officer-data-version.json
          git commit -m 'v4.6.0 TEST dynamic Officer data updates'
          git pull --rebase origin main
          git push origin main
