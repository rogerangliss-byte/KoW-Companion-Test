name: Officer profile and progress regression tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/officer-filter-selection.test.mjs'
      - 'tests/officer-progress-overview.test.mjs'
      - 'tests/upgrade-targets-orv-remainder.test.mjs'
      - 'v460-features.js'
      - '.github/workflows/officer-filter-regression.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/officer-filter-selection.test.mjs'
      - 'tests/officer-progress-overview.test.mjs'
      - 'tests/upgrade-targets-orv-remainder.test.mjs'
      - 'v460-features.js'
      - '.github/workflows/officer-filter-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  officer-filter-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Officer regression tests
        run: node --test tests/*.test.mjs
