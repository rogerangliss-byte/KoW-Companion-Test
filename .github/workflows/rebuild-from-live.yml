name: Clean rebuild English Test from Live

on:
  push:
    paths:
      - '.github/workflows/rebuild-from-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout English Test
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone stable English Live
        run: git clone --depth 1 https://github.com/rogerangliss-byte/KoW-Companion.git /tmp/kow-live

      - name: Replace Test working tree with Live baseline
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='CNAME' \
            /tmp/kow-live/ ./

      - name: Apply clean Test identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>KoW Companion v4.4.0</title>','<title>KoW Companion v4.5.0 TEST</title>',1)
          s=s.replace("const APP_VERSION='4.4.0';","const APP_VERSION='4.5.0';",1)
          banner='''\n<div id="englishTestBanner" style="position:relative;z-index:9999;background:#8b1111;color:#fff;text-align:center;font-weight:800;letter-spacing:.08em;padding:8px 12px;border-bottom:2px solid #ff7676">ENGLISH TEST — v4.5.0 — NOT LIVE</div>\n'''
          if 'id="englishTestBanner"' not in s:
              s=s.replace('<body>','<body>'+banner,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Install clean Test service worker
        run: |
          cat > service-worker.js <<'EOF'
          const CACHE='kow-english-test-v4.5.0-clean-live-baseline-1';
          self.addEventListener('install',event=>{self.skipWaiting();});
          self.addEventListener('activate',event=>{
            event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));
          });
          self.addEventListener('fetch',event=>{
            if(event.request.method!=='GET')return;
            event.respondWith(fetch(event.request,{cache:'no-store'}).then(response=>{
              const copy=response.clone();
              caches.open(CACHE).then(cache=>cache.put(event.request,copy));
              return response;
            }).catch(()=>caches.match(event.request).then(r=>r||caches.match('./index.html'))));
          });
          EOF

      - name: Keep Test domain and remove Live release marker
        run: |
          printf '%s\n' 'englishtest.firestorm-companion.uk' > CNAME
          rm -f RELEASE-v4.4.0-LIVE.md
          cat > RELEASE-v4.5.0-TEST1.md <<'EOF'
          # KoW Companion v4.5.0 — CLEAN TEST BASELINE

          This Test build was rebuilt directly from the stable English Live v4.4.0 source.

          Purpose of this baseline:
          - prove normal loading/navigation without runtime patch layers;
          - verify backup restore matches Live behaviour;
          - verify no flicker/freezes;
          - provide the clean base for native v4.5.0 feature integration.

          Test environment only — NOT LIVE.
          EOF

      - name: Commit clean baseline
        run: |
          git config user.name 'FireStorm'
          git config user.email 'roger.angliss@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Rebuild English Test cleanly from stable English Live baseline'
          git push origin main
