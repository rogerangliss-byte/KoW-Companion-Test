name: Native v4.5.0 Test rebuild

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.issue.title == 'TRIGGER NATIVE V450 REBUILD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild application from current English Live stable
        run: |
          set -euo pipefail
          LIVE='https://raw.githubusercontent.com/rogerangliss-byte/KoW-Companion/main'
          curl -fsSL "$LIVE/index.html" -o index.html
          curl -fsSL "$LIVE/service-worker.js" -o service-worker.js
          curl -fsSL "$LIVE/manifest.json" -o manifest.json
          curl -fsSL "$LIVE/officers.json" -o officers.json
          curl -fsSL "$LIVE/officers.csv" -o officers.csv

          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # ---- Test identity is physical source, not a runtime rewrite ----
          s=s.replace('<title>KoW Companion v4.4.0</title>','<title>KoW Companion v4.5.0 TEST</title>')
          s=s.replace("const APP_VERSION='4.4.0';","const APP_VERSION='4.5.0';")
          banner='<div id="helpPortraitTestBanner" style="position:sticky;top:0;z-index:9999;background:#8b0000;color:#fff;text-align:center;font-weight:800;padding:6px">ENGLISH TEST VERSION — v4.5.0 TEST 1 — CLEAN LIVE-BASE REBUILD — NOT LIVE</div>'
          s=s.replace('<body>','<body>'+banner,1)
          s=s.replace("document.title='KoW Companion v4.3.55';","document.title='KoW Companion v4.5.0 TEST';")

          # ---- Development UI: correct the two chest definitions ----
          s=s.replace(
            '<div class="notice">Each <b>Legendary Officer Badge Selection Chest</b> gives <b>1 specific Legendary Officer Badge</b> for an Officer currently available in the chest. It does not convert to a Universal Legendary Badge or ORV.</div>',
            '<div class="notice">Each <b>Legendary Officer Badge Selection Chest</b> gives <b>1 eligible individual Officer Badge</b> for an Officer currently available in the chest. It has <b>no ORV option</b> and does not become a Universal Badge.</div>'
          )
          s=re.sub(
            r'<div class="notice">\s*Each Selection Chest can be used as either <b>1 Universal Legendary Badge</b> or\s*<b><span id="selectionChestOrvValue">600</span> Officer Readiness Vouchers</b>\.\s*The ORV value follows the highest ORV-per-badge cost in the latest published season\.\s*</div>',
            '<div class="notice">Each <b>Legendary Officer Badge Chest</b> gives either <b>1 Universal Legendary Officer Badge</b> or <b><span id="selectionChestOrvValue">600</span> Officer Readiness Vouchers (ORV)</b>. A Badge Chest cannot count as both.</div>',
            s,flags=re.S
          )
          s=s.replace('<label>Use Selection Chests as</label>\n      <select id="legendaryBadgeChestMode">\n        <option value="badge">Universal Legendary Badges</option>\n        <option value="orv">Officer Readiness Vouchers</option>\n      </select>',
                      '<label>Use Legendary Officer Badge Chests as</label>\n      <select id="legendaryBadgeChestMode">\n        <option value="optimise">Optimise automatically</option>\n        <option value="badge">Universal Legendary Badges (1 each)</option>\n        <option value="orv">Officer Readiness Vouchers (600 each)</option>\n      </select>')
          s=s.replace('<div class="stat"><span>Universal Legendary Badges available</span><b id="universalBadgesAvailable">0</b></div>',
                      '<div class="stat"><span>Universal Legendary Badges available</span><b id="universalBadgesAvailable">0</b></div>\n      <div class="stat"><span>Eligible Officer Badges from Selection Chests</span><b id="selectionChestBadgesAvailable">0</b></div>')
          s=s.replace('<span>ORV generated from Selection Chests</span>','<span>ORV generated from Legendary Officer Badge Chests</span>')

          # ---- Exact Selection Chest pool ----
          eligible='''const LEGENDARY_SELECTION_CHEST_ELIGIBLE = new Set(["Katherine", "Grace", "Chloe", "Ling", "Jessica", "Lilith", "Angel", "Sakura", "Loubna", "Angelica", "Ophelia", "Doireann", "S2 Natalia", "S3 Sophia", "S6 Emily", "S6 Zoya"]);'''
          s,n=re.subn(r'const LEGENDARY_SELECTION_CHEST_ELIGIBLE\s*=\s*new Set\(\[[^\]]*\]\);',eligible,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Selection Chest pool not found')
          s=s.replace('function selectionChestEligibleOfficer(o){\n  return LEGENDARY_SELECTION_CHEST_ELIGIBLE.has(String(o?.name||o||\'\').trim());\n}',
                      'function selectionChestEligibleOfficer(o){\n  return LEGENDARY_SELECTION_CHEST_ELIGIBLE.has(String(o?.name||o||\'\').trim());\n}\nwindow.KOW_SELECTION_CHEST_ELIGIBLE=LEGENDARY_SELECTION_CHEST_ELIGIBLE;')

          # ---- Replace old mixed-up Development resource block natively ----
          start=s.find(" const badgesHeld=+$('badgeHeld').value;")
          end=s.find("\n let xpHeld=0;XP_DENOMS.forEach",start)
          if start<0 or end<0: raise SystemExit('Development funding block not found')
          block=''' const badgesHeld=+$('badgeHeld').value;
 const universalBadgesHeld=officerRarity(o)==='Epic'?+$('universalEpicBadgeHeld').value:officerRarity(o)==='Elite'?+$('universalEliteBadgeHeld').value:+$('universalBadgeHeld').value;
 const badgeChests=officerRarity(o)==='Legendary'?+$('legendaryBadgeChestHeld').value:0;
 const selectionChests=officerRarity(o)==='Legendary'?+$('legendarySelectionChestHeld').value:0;
 const selectionChestBadges=officerRarity(o)==='Legendary'&&selectionChestEligibleOfficer(o)?selectionChests:0;
 const chestMode=$('legendaryBadgeChestMode').value;
 const canChestOrv=officerRarity(o)==='Legendary'&&readinessEligible&&o.orv>0;
 let badgeChestBadges=badgeChests,badgeChestOrv=0;
 if(chestMode==='orv'&&canChestOrv){badgeChestBadges=0;badgeChestOrv=badgeChests*600;}
 else if(chestMode==='optimise'&&canChestOrv&&Math.floor(600/o.orv)>1){badgeChestBadges=0;badgeChestOrv=badgeChests*600;}
 const universalBadgesAvailable=universalBadgesHeld+badgeChestBadges;
 const directOrv=+$('orvHeld').value;
 const orvHeld=directOrv+badgeChestOrv;
 $('selectionChestOrvValue').textContent='600';
 $('selectionChestOrvGenerated').textContent=fmt(badgeChestOrv);
 $('selectionChestBadgesAvailable').textContent=fmt(selectionChestBadges);
 $('universalBadgesAvailable').textContent=fmt(universalBadgesAvailable);

 const officerMaxBadges=maxBadgesForOfficer(o);
 const badgesUsed=($('unlocked').checked?10:0)+skillBadgesSpent()+ +$('training').value*trainingBadgeCost(o);
 const badgesFromOrv=readinessEligible&&o.orv>0?Math.floor(orvHeld/o.orv):0;
 const orvRemainder=o.orv>0?orvHeld-badgesFromOrv*o.orv:orvHeld;
 const badgeTotal=badgesUsed+badgesHeld+selectionChestBadges+universalBadgesAvailable+badgesFromOrv;
 const badgesRequired=Math.max(0,officerMaxBadges-badgeTotal);
 const orvRequired=readinessEligible?badgesRequired*o.orv:0;
 $('trainingLabel').textContent=$('training').value;$('badgesUsed').textContent=fmt(badgesUsed);$('badgesFromOrv').textContent=fmt(badgesFromOrv);$('orvRemainder').textContent=fmt(orvRemainder);$('badgesRequired').textContent=fmt(badgesRequired);$('orvRequired').textContent=fmt(orvRequired);$('badgeBar').style.width=pct(badgeTotal,officerMaxBadges)+'%';
 window.KOW_V450_FUNDING={officer:o.name,need:Math.max(0,officerMaxBadges-badgesUsed),individual:badgesHeld,selectionHeld:selectionChests,selectionEligible:selectionChestEligibleOfficer(o),selectionBadges:selectionChestBadges,universalHeld:universalBadgesHeld,badgeChests,badgeChestBadges,badgeChestOrv,directOrv,orvBadges:badgesFromOrv,shortfall:badgesRequired};
'''
          s=s[:start]+block+s[end:]
          s=s.replace("renderPlanner(o,cs,starsUsed,legendaryHeld,srvHeld,badgesUsed,badgesHeld+universalBadgesAvailable,orvHeld,xpHeld,xpRequired);",
                      "renderPlanner(o,cs,starsUsed,legendaryHeld,srvHeld,badgesUsed,badgesHeld+selectionChestBadges+universalBadgesAvailable,orvHeld,xpHeld,xpRequired);\n renderV450SmartShortfall();",1)

          # ---- Persist Selection Chests with global resources ----
          s=s.replace("legendaryBadgeChestHeld:$('legendaryBadgeChestHeld').value,\n  legendaryBadgeChestMode:$('legendaryBadgeChestMode').value,",
                      "legendaryBadgeChestHeld:$('legendaryBadgeChestHeld').value,\n  legendarySelectionChestHeld:$('legendarySelectionChestHeld').value,\n  legendaryBadgeChestMode:$('legendaryBadgeChestMode').value,")
          s=s.replace("$('legendaryBadgeChestHeld').value=d.legendaryBadgeChestHeld??0;\n  $('legendaryBadgeChestMode').value=d.legendaryBadgeChestMode??'badge';",
                      "$('legendaryBadgeChestHeld').value=d.legendaryBadgeChestHeld??0;\n  $('legendarySelectionChestHeld').value=d.legendarySelectionChestHeld??0;\n  $('legendaryBadgeChestMode').value=d.legendaryBadgeChestMode??'optimise';")
          s=s.replace("'legendaryBadgeChestHeld','legendaryBadgeChestMode','orvHeld'","'legendaryBadgeChestHeld','legendarySelectionChestHeld','legendaryBadgeChestMode','orvHeld'")
          s=s.replace("['universalBadgeHeld','legendaryBadgeChestHeld','legendaryBadgeChestMode']","['universalBadgeHeld','legendaryBadgeChestHeld','legendarySelectionChestHeld','legendaryBadgeChestMode']")

          # ---- Smart Resource Shortfall is a native Planner card/function ----
          card='''<article class="card" id="v450SmartPlannerCard">
      <div class="eyebrow">v4.5.0 TEST 1</div>
      <h2>🧠 Smart Resource Shortfall</h2>
      <p class="muted">Preview the selected Officer using the corrected Badge Chest and Selection Chest rules. Inventory is never spent or changed.</p>
      <div id="v450SmartPlannerResult" class="result-box">Select an Officer and enter or save Inventory.</div>
    </article>

    '''
          marker='<article class="card">\n      <h2>🧮 Resource Optimiser — Preview</h2>'
          if marker not in s: raise SystemExit('Resource Optimiser card not found')
          s=s.replace(marker,card+marker,1)
          smart='''
function renderV450SmartShortfall(){
 const box=$('v450SmartPlannerResult');if(!box)return;
 const f=window.KOW_V450_FUNDING;if(!f){box.textContent='Select an Officer and enter or save Inventory.';return}
 const covered=Math.max(0,f.need-f.shortfall);
 const status=f.shortfall===0?'✅ FULLY FUNDED':covered>0?'🟠 PARTIALLY FUNDED':'🔴 SHORTFALL';
 const selection=f.selectionHeld?(f.selectionEligible?`${fmt(f.selectionBadges)} eligible individual Officer Badge${f.selectionBadges===1?'':'s'}`:`0 usable — ${f.officer} is not currently in the Selection Chest pool`):'0 held';
 box.innerHTML=`<b>${status} — ${esc(f.officer)}</b><br>`+
  `Badges needed from current progress: <b>${fmt(f.need)}</b><br>`+
  `Individual Officer Badges held: <b>${fmt(f.individual)}</b><br>`+
  `Selection Chests: <b>${selection}</b><br>`+
  `Universal Legendary Badges held: <b>${fmt(f.universalHeld)}</b><br>`+
  `Legendary Badge Chests: <b>${fmt(f.badgeChestBadges)} badge route${f.badgeChestOrv?` · ${fmt(f.badgeChestOrv)} ORV generated`:''}</b><br>`+
  `ORV-funded Badges: <b>${fmt(f.orvBadges)}</b><br>`+
  `<b>Remaining badge shortfall: ${fmt(f.shortfall)}</b><br>`+
  `<span class="muted">Selection Chest = 1 eligible individual Officer Badge only. Badge Chest = 1 Universal Legendary Badge or 600 ORV.</span>`;
}
'''
          s=s.replace('function validateDb(list=officers){',smart+'\nfunction validateDb(list=officers){',1)

          # ---- Resource Optimiser keeps canonical selector and corrected terminology ----
          s=s.replace('Universal Legendary Badges / Selection Chests','Universal Legendary Badges / Legendary Officer Badge Chests')

          # ---- Multi-Officer planner: save/load Selection Chests and recalc on changes ----
          s=s.replace("chests:+$('multiChests').value||0,chestMode:$('multiChestMode').value,officers:multiPlanOfficers",
                      "chests:+$('multiChests').value||0,selectionChests:+$('multiSelectionChests').value||0,chestMode:$('multiChestMode').value,officers:multiPlanOfficers")
          s=s.replace("$('multiChests').value=p.chests||0;$('multiChestMode').value=p.chestMode||'optimise';",
                      "$('multiChests').value=p.chests||0;$('multiSelectionChests').value=p.selectionChests||0;$('multiChestMode').value=p.chestMode||'optimise';")
          s=s.replace("['multiOrv','multiUniversal','multiChests','multiChestMode']","['multiOrv','multiUniversal','multiChests','multiSelectionChests','multiChestMode']")

          # ---- Central Inventory bridge uses real field ids/names ----
          s=s.replace("['universalLegendaryHeld','invUniversalLegendary']","['universalBadgeHeld','invUniversalLegendary']")
          s=s.replace("kowInvField('officerBadgesHeld',x.officerBadges[sel.value]||0)","kowInvField('badgeHeld',x.officerBadges[sel.selectedOptions?.[0]?.textContent?.trim()]||0)")

          # ---- Advanced Planner: distinguish Badge Chests from Selection Chests ----
          s=s.replace('var inv={orv:0,srv:0,universal:0,selection:0,xp:0,starValue:0};','var inv={orv:0,srv:0,universal:0,badgeChests:0,selection:0,xp:0,starValue:0};')
          s=s.replace("inv.selection=liveNum('legendaryBadgeChestHeld',g.legendaryBadgeChestHeld);",
                      "inv.badgeChests=liveNum('legendaryBadgeChestHeld',g.legendaryBadgeChestHeld);\n    inv.selection=liveNum('legendarySelectionChestHeld',g.legendarySelectionChestHeld);")
          s=s.replace('function score(r,inv){var remaining=Math.max(0,r.need),affordable=inv.universal+inv.selection+(r.orvCost?Math.floor(inv.orv/r.orvCost):0),gap=Math.max(0,remaining-affordable);return (r.pct*1000)-gap;}',
                      "function score(r,inv){var remaining=Math.max(0,r.need),pool=window.KOW_SELECTION_CHEST_ELIGIBLE||new Set(),selection=pool.has(String(r.name||'').trim())?inv.selection:0,affordable=inv.universal+inv.badgeChests+selection+(r.orvCost?Math.floor(inv.orv/r.orvCost):0),gap=Math.max(0,remaining-affordable);return (r.pct*1000)-gap;}")
          s=s.replace('var badgeEquiv=(inv.universal||0)+(inv.selection||0)+Math.floor((inv.orv||0)/c.orv);',
                      'var badgeEquiv=(inv.universal||0)+(inv.badgeChests||0)+Math.floor((inv.orv||0)/c.orv);')
          s=s.replace("Inventory detected: ORV '+inv.orv.toLocaleString()+', Universal Badges '+inv.universal.toLocaleString()+', Selection Chests '+inv.selection.toLocaleString()+', XP '+inv.xp.toLocaleString()+'. No Inventory values have been changed.",
                      "Inventory detected: ORV '+inv.orv.toLocaleString()+', Universal Badges '+inv.universal.toLocaleString()+', Badge Chests '+inv.badgeChests.toLocaleString()+', Selection Chests '+inv.selection.toLocaleString()+', XP '+inv.xp.toLocaleString()+'. No Inventory values have been changed.")
          s=s.replace('Preserve Universal/Selection resources where practical.','Preserve Universal/Badge Chest resources where practical.')
          s=s.replace('Use flexible Universal/Selection resources only where required.','Use flexible Universal/Badge Chest resources only where required.')

          # ---- Future projected Officers cannot assume current Selection Chest eligibility ----
          s=s.replace('return {badges:universal+badgeChests+selectionChests,stars,xp,orv:val(\'invOrv\'),srv:val(\'invSrv\'),badgeParts:{universal,badgeChests,selectionChests},savedAt:x.savedAt||null};',
                      "return {badges:universal+badgeChests,stars,xp,orv:val('invOrv'),srv:val('invSrv'),badgeParts:{universal,badgeChests,selectionChests},savedAt:x.savedAt||null};")
          s=s.replace('// Future Legendary Officers can use shared Legendary badge resources. Each chest is one badge-equivalent.','// Future projected Officers can use Universal Legendary Badges and Legendary Badge Chests. Current Selection Chests are excluded until a future Officer is confirmed eligible.')

          # ---- Help text and What's New ----
          s=re.sub(r'<p>Each <b>Legendary Officer Badge Selection Chest</b> can be used as <b>either</b> 1 Universal Legendary Badge <b>or</b> converted to the latest-Season Officer Readiness Voucher \(ORV\) value\. A chest cannot count as both\. With the current S7 database the benchmark is <b>600 ORV per chest</b>\.</p>',
                   '<p>Each <b>Legendary Officer Badge Chest</b> can be used as <b>either</b> 1 Universal Legendary Badge <b>or</b> <b>600 ORV</b>. A Badge Chest cannot count as both.</p><p>Each <b>Legendary Officer Badge Selection Chest</b> gives <b>1 eligible individual Officer Badge only</b>. It has no ORV option and does not become a Universal Badge.</p>',s)
          s=s.replace('<h3 style="margin-top:0">✨ What’s New — v4.4.0 LIVE</h3>','<h3 style="margin-top:0">✨ What’s New — v4.5.0 TEST 1</h3>',1)

          # No external patch/fix architecture in the rebuilt app.
          s=re.sub(r'\n?<script src="\./v450-[^"]+"></script>','',s)
          p.write_text(s,encoding='utf-8')

          # Clean network-first service worker from Live, Test cache identity only.
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          sw=re.sub(r"const CACHE='[^']+';","const CACHE='kow-english-v4.5.0-test1-native';",sw,1)
          Path('service-worker.js').write_text(sw,encoding='utf-8')
          PY

          # Remove all temporary v4.5 fix architecture and this one-shot trigger itself.
          rm -f v450-patch.js v450-optimiser-officer-fix.js download testwrite V4.5.0-PLAN.md RELEASE-v4.4.0-TEST1.md
          rm -f .github/workflows/native-v450-rebuild.yml

      - name: Verify native clean build
        run: |
          set -euo pipefail
          grep -F 'ENGLISH TEST VERSION — v4.5.0 TEST 1 — CLEAN LIVE-BASE REBUILD — NOT LIVE' index.html
          grep -F "const APP_VERSION='4.5.0';" index.html
          grep -F 'Smart Resource Shortfall' index.html
          grep -F '1 eligible individual Officer Badge' index.html
          grep -F '600 Officer Readiness Vouchers (ORV)' index.html
          grep -F "legendarySelectionChestHeld:$('legendarySelectionChestHeld').value" index.html
          grep -F "badgeChests:0,selection:0" index.html
          ! grep -q 'v450-patch.js' index.html
          ! grep -q 'v450-optimiser-officer-fix.js' index.html
          ! grep -q 'transformHtml' service-worker.js
          test ! -e v450-patch.js
          test ! -e v450-optimiser-officer-fix.js
          test ! -e .github/workflows/native-v450-rebuild.yml

      - name: Commit native clean rebuild
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild v4.5.0 TEST 1 natively from English Live stable'
          git push
