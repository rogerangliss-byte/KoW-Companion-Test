name: Apply Excel Inventory Order

on:
  push:
    paths:
      - '.github/workflows/apply-inventory-order.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild Inventory card in supplied Order in List
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          start_marker='<div class="card"><h2>📦 Central Inventory</h2>'
          end_marker='</div></section>\n<section id="settings" class="view">'
          start=s.find(start_marker)
          end=s.find(end_marker,start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate Central Inventory card boundaries')

          def field(label,id_):
              return f'<div><label>{label}</label><input id="{id_}" type="number" min="0" value="0"></div>'

          def badge(display,key,rarity,order=None):
              order_attr=f' data-inventory-order="{order}"' if order is not None else ' data-inventory-order="unlisted"'
              return (f'<label class="inv-officer-badge-row" data-rarity="{rarity}"{order_attr}>'
                      f'<span>{display}</span><input class="inv-officer-badge-input" type="number" min="0" value="0" '
                      f'data-officer="{key}" aria-label="{display} Badges Held"></label>')

          ordered_officers=[
              (8,'Marjorie','Marjorie','Elite'),(9,'Jeanne','Jeanne','Elite'),
              (10,'Riven','Riven','Epic'),(11,'Linda','Linda','Epic'),(12,'Maria','Maria','Epic'),
              (13,'Evelyn','Evelyn','Epic'),(14,'Helena','Helena','Epic'),(15,'Dorothea','Dorothea','Epic'),
              (16,'Abigail','Abigail','Epic'),(17,'Monica','Monica','Epic'),
              (18,'Katherine','Katherine','Legendary'),(19,'Angelica','Angelica','Legendary'),
              (20,'Doireann','Doireann','Legendary'),(21,'Grace','Grace','Legendary'),
              (22,'Jessica','Jessica','Legendary'),(23,'Chloe','Chloe','Legendary'),
              (24,'Angel','Angel','Legendary'),(25,'Lilith','Lilith','Legendary'),
              (26,'Loubna','Loubna','Legendary'),(27,'S2 Natalia','S2 Natalia','Legendary'),
              (28,'Ophelia','Ophelia','Legendary'),(29,'S2 Diana','S2 Diana','Legendary'),
              (30,'Ling','Ling','Legendary'),(31,'Sakura','Sakura','Legendary'),
              (32,'S2 Amanda','S2 Amanda','Legendary'),(33,'S2 Lady Pandora','S2 Lady Pandora','Legendary'),
              (34,'S3 Oliva','S3 Oliva','Legendary'),(35,'S3 Sophia','S3 Sophia','Legendary'),
              (36,'S3 Christina','S3 Christina','Legendary'),(37,'S3 Hannah','S3 Hannah','Legendary'),
              (38,'S3 Ada','S3 Ada','Legendary'),(39,'S3 Aurora','S3 Aurora','Legendary'),
              (40,'S3 Erica','S3 Erica','Legendary'),(41,'S3 Su','S3 Su','Legendary'),
              (42,'S4 Erin','S4 Erin','Legendary'),(43,'S4 Hardwin','S4 Hardwin','Legendary'),
              (44,'S4 Derya','S4 Derya','Legendary'),(45,'S4 Eunice','S4 Eunice','Legendary'),
              (46,'S4 Yuki','S4 Yuki','Legendary'),(47,'S4 Anna','S4 Anna','Legendary'),
              (48,'S4 Jane','S4 Jane','Legendary'),(49,'S4 Melina','S4 Melina','Legendary'),
              (50,'S5 Julia','S5 Julia','Legendary'),(51,'S5 Miyeon','S5 Miyeon','Legendary'),
              (52,'S5 Betty','S5 Betty','Legendary'),(53,'S5 Camile','S5 Camile','Legendary'),
              (54,'S5 Elsa','S5 Elsa','Legendary'),(55,'S5 Eva','S5 Eva','Legendary'),
              (56,'S5 Halina','S5 Halina','Legendary'),(57,'S6 Zoya','S6 Zoya','Legendary'),
              (58,'S6 Red Queen','S6 Red Queen','Legendary'),(59,'S5 Feng','S5 Feng','Legendary'),
              (60,'S6 Emily','S6 Emily','Legendary'),(61,'S6 Regina','S6 Regina','Legendary'),
              (62,'S6 Veronica','S6 Veronica','Legendary'),(63,'S7 Kamila','S7 Kamila','Legendary'),
              (64,'S7 Code','S7 Code','Legendary'),(65,'S7 Klara','S7 Klara','Legendary'),
              (66,'S7 Stella','S7 Stella','Legendary'),(67,'S7 Liora','S7 Liora','Legendary'),
              (68,'S7 Romana','S7 Romana','Legendary'),(69,'S7 Barbara','S7 Barbara','Legendary'),
              (70,'S7 Roisin','S7 Roisin','Legendary'),
          ]
          unlisted_officers=[
              ('S6 Silverhand','S6 Silverhand','Legendary'),
              ('S6 Samantha','S6 Samantha','Legendary'),
              ('S6 Saoirse','S6 Saoirse','Legendary'),
          ]

          officer_html=''.join(badge(display,key,rarity,order) for order,display,key,rarity in ordered_officers)
          officer_html+=''.join(badge(display,key,rarity,None) for display,key,rarity in unlisted_officers)

          new_card='''<div class="card"><h2>📦 Central Inventory</h2>
<p>Enter resources once and press <b>Save Inventory</b>. The saved inventory is then used throughout the app. Items follow the supplied <b>Order in List</b> sequence.</p>
<div id="inventorySavedStatus" class="notice">Inventory not yet saved.</div>
<h3>Badge & Voucher Resources</h3>
<div class="grid2">'''
          new_card+=field('Legendary Officer Badge Chests','invLegendaryBadgeChests')
          new_card+=field('Legendary Officer Badge Selection Chests','invLegendarySelectionChests')
          new_card+=field('Officer Readiness Vouchers (ORV)','invOrv')
          new_card+=field('Star Readiness Vouchers (SRV)','invSrv')
          new_card+=field('Universal Legendary Badges','invUniversalLegendary')
          new_card+=field('Universal Epic Badges','invUniversalEpic')
          new_card+=field('Universal Elite Badges','invUniversalElite')
          new_card+='''</div>
<h3>Individual Officer Badges</h3>
<p class="notice">Enter badge quantities for any <b>Elite, Epic or Legendary Officer</b>, then press <b>Save Inventory</b>. Every Officer remains stored separately. The sequence below follows the supplied <b>Order in List</b>; existing app Officers not assigned an order in that file are retained after the ordered list.</p>
<div class="inv-badge-rarity-filter" role="group" aria-label="Officer badge rarity filter">
<button type="button" class="inv-rarity-btn active" data-rarity="All">All</button>
<button type="button" class="inv-rarity-btn" data-rarity="Elite">Elite</button>
<button type="button" class="inv-rarity-btn" data-rarity="Epic">Epic</button>
<button type="button" class="inv-rarity-btn" data-rarity="Legendary">Legendary</button>
</div><div id="invOfficerBadgeGrid" class="inv-officer-badge-grid">'''+officer_html+'''</div>
<div id="invOfficerList" class="notice">No individual Officer Badges entered.</div>
<h3>Officer Stars</h3>
<div class="grid2">'''
          new_card+=field('Elite Star I','invEliteStar1')+field('Elite Star II','invEliteStar2')+field('Elite Star III','invEliteStar3')
          new_card+=field('Epic Star I','invEpicStar1')+field('Epic Star II','invEpicStar2')+field('Epic Star III','invEpicStar3')
          new_card+=field('Legendary Star I','invLegStar1')+field('Legendary Star II','invLegStar2')+field('Legendary Star III','invLegStar3')
          new_card+='''</div>
<h3>Officer XP Books</h3><div class="grid4">'''
          new_card+=field('100 XP Book','invXp100')+field('500 XP Book','invXp500')+field('1,000 XP Book','invXp1000')
          new_card+=field('5,000 XP Book','invXp5000')+field('10,000 XP Book','invXp10000')+field('20,000 XP Book','invXp20000')+field('50,000 XP Book','invXp50000')
          new_card+=field('50 XP Book','invXp50')
          new_card+='''</div>
<div class="inventory-save-actions"><button id="saveInventory" type="button" class="app-action-save">Save Inventory</button><button id="resetInventory" type="button" class="app-action-danger">Reset Inventory</button></div>
</div></section>'''

          s=s[:start]+new_card+s[end+len('</div></section>'):]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate supplied order and preserved controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'invLegendaryBadgeChests','invLegendarySelectionChests','invOrv','invSrv','invUniversalLegendary','invUniversalEpic','invUniversalElite',
            'data-inventory-order="8"','data-inventory-order="27"','data-inventory-order="59"','data-inventory-order="70"',
            'invEliteStar1','invEliteStar2','invEliteStar3','invEpicStar1','invEpicStar2','invEpicStar3','invLegStar1','invLegStar2','invLegStar3',
            'invXp100','invXp500','invXp1000','invXp5000','invXp10000','invXp20000','invXp50000','invXp50'
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('Missing controls: '+', '.join(missing))
          ordered=['invLegendaryBadgeChests','invLegendarySelectionChests','invOrv','invSrv','invUniversalLegendary','invUniversalEpic','invUniversalElite']
          pos=[s.index(x) for x in ordered]
          if pos!=sorted(pos): raise SystemExit('Top Inventory order validation failed')
          if not (s.index('data-inventory-order="27"') < s.index('data-inventory-order="28"') < s.index('data-inventory-order="29"')):
              raise SystemExit('Cross-season Officer order validation failed')
          if not (s.index('data-inventory-order="57"') < s.index('data-inventory-order="58"') < s.index('data-inventory-order="59"') < s.index('data-inventory-order="60"')):
              raise SystemExit('S5/S6 cross-order validation failed')
          if not (s.index('invEliteStar1') < s.index('invEpicStar1') < s.index('invLegStar1') < s.index('invXp100')):
              raise SystemExit('Star/XP sequence validation failed')
          print('Inventory order validation PASS')
          PY
      - name: Commit Inventory order
        run: |
          git config user.name 'FireStorm'
          git config user.email 'roger.angliss@gmail.com'
          git add index.html
          git commit -m 'Order Inventory by supplied Excel list'
          git push origin main
# trigger
