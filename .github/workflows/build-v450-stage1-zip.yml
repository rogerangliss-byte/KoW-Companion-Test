name: Build v4.5 Stage 1 Upload ZIP

on:
  push:
    paths:
      - '.github/workflows/build-v450-stage1-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare tolerant clean-baseline integration script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/native_stage1.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if old not in s:\n        raise SystemExit(f'Missing expected source for {label}')","if old not in s:\n        print(f'MISSING: {label}')\n        return")
          s=s.replace("$('legendaryBadgeChestHeld').value=d.legendaryBadgeChestHeld??0;\\n  $('legendaryBadgeChestMode').value=d.legendaryBadgeChestMode??'badge';","$('legendaryBadgeChestHeld').value=d.legendaryBadgeChestHeld??0;\\n $('legendaryBadgeChestMode').value=d.legendaryBadgeChestMode??'badge';")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply native Stage 1 integration
        run: python3 .github/native_stage1.py | tee stage1-script.log
      - name: Validate and build package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'native state':'kow_ui_state_v450_native1' in s,
            'planner restore':'restorePlannerWorkingState();' in s,
            'selected officer':'renderOfficerOptions(getUiState().officerName||undefined)' in s,
            'progress persistence':'saveStatusFilterState();renderSavedOfficerProgress();' in s,
            'compare persistence':'saveComparePickState()' in s,
            'selection chest saved':'legendarySelectionChestHeld:$' in s,
            'selection chest restored':"$('legendarySelectionChestHeld').value=d.legendarySelectionChestHeld??0;" in s,
            'correct badge chest ORV':'Officer Readiness Vouchers (600 each)' in s,
            'wrong selection wording removed':'Use Selection Chests as' not in s,
          }
          log=Path('stage1-script.log').read_text(errors='ignore') if Path('stage1-script.log').exists() else ''
          report=['KoW Companion v4.5.0 TEST Stage 1 build report','']+[f"{'PASS' if ok else 'FAIL'} - {name}" for name,ok in checks.items()]+['','Script output:',log]
          Path('STAGE1-BUILD-REPORT.txt').write_text('\n'.join(report),encoding='utf-8')
          if not all(checks.values()):
            raise SystemExit('Stage 1 validation failed')
          PY
          rm -rf upload-package && mkdir upload-package
          cp index.html CNAME manifest.json service-worker.js officers-default.csv README.md USER-GUIDE.md CHANGELOG.md RELEASE-v4.5.0-TEST1.md upload-package/ 2>/dev/null || true
          printf '%s\n' 'KoW Companion v4.5.0 TEST — Stage 1 native integration' 'Extract this ZIP and upload/replace these files in the KoW-Companion-Test repository root. Leave officer-portraits and background images untouched.' > upload-package/UPLOAD-INSTRUCTIONS.txt
          cd upload-package && zip -r ../KoW-Companion-v4.5.0-TEST-Stage1-Upload.zip .
      - name: Publish ZIP to repository
        if: success()
        run: |
          git config user.name 'FireStorm'
          git config user.email 'roger.angliss@gmail.com'
          git add KoW-Companion-v4.5.0-TEST-Stage1-Upload.zip STAGE1-BUILD-REPORT.txt
          git commit -m 'Publish v4.5 Stage 1 upload ZIP'
          git push origin main
